[project]
name = "argos"
version = "0.1.0"
description = "Modular OSINT and cybersecurity platform"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.2.4",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["frontend"]
wheel-exclude = ["frontend"]

[tool.pytest.ini_options]
testpaths = ["tests", "argos/backend/tests"]

[tool.pyright]
include = ["argos", "tests"]
exclude = ["argos/frontend", "**/__pycache__", "**/node_modules"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["argos", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
